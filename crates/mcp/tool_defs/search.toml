[[tools]]
name = "code_search"
description = "Ranked search over indexed code chunks (BM25, plus vectors when embeddings exist). Returns source excerpts with paths and 1-based line ranges. Use when you start from a concept (\u201cwhere is rate limiting?\u201d) rather than a name \u2014 prefer `find_symbol` for identifiers and `grep_code` for literal strings."
handler = "search::call_code_search"
calling_convention = "engine_args_progress"
read_only = true

[tools.params.query]
type = "string"
description = "Natural-language or code query (max 1024 characters)."
required = true

[tools.params.strategy]
type = "string"
description = "Retrieval strategy. Omit to auto-detect from the query (recommended). instant=BM25, fast=hybrid BM25+vector, thorough=hybrid+MMR, explore=BM25+graph expansion, deep=hybrid+reranker, exact=substring lookup, goto=definition lookup, semantic=behavioral signatures."
enum = ["instant", "fast", "thorough", "explore", "deep", "exact", "goto", "semantic"]

[tools.params.limit]
type = "integer"
description = "Maximum results (default: 10, hard max: 100)."

[tools.params.token_budget]
type = "integer"
description = "Maximum tokens in the response (default: 4000, hard max: 12000)."

[tools.params.check_staleness]
type = "boolean"
description = "Also scan for files changed since indexing and warn if the index is stale (slow on huge repositories). Default: false."

[tools.params.file_filter]
type = "string"
description = "Only results whose path contains this substring (e.g. 'src/graph')."

[tools.params.kind]
type = "string"
description = "Only results of this symbol kind."
enum = ["function", "struct", "enum", "trait", "class", "method", "interface", "type", "const", "impl"]

[tools.params.queries]
type = "array"
items_type = "string"
description = "Query reformulations to fuse (RRF); overrides auto-reformulation."

[tools.params.source]
type = "string"
description = "Restrict to imported external context: 'external', or a namespace such as 'github', 'adr', 'jira', 'linear'."

[tools.params.compact]
type = "boolean"
description = "If true, one line per hit (path:start-end, signature, 3-line snippet) instead of full code blocks: the cheapest way to locate code."

[[tools]]
name = "find_symbol"
description = "Look up symbols (functions, structs, classes, traits, methods, etc.) by name. Case-insensitive substring match, ordered exact name first, then types before functions before impl blocks, production code before tests. One line per symbol: `Kind name  path:start-end` (1-based lines). Use when you know the symbol name \u2014 prefer `code_search` for concept queries, `read_symbol` to read the source."
handler = "search::call_find_symbol"
calling_convention = "engine_args"
read_only = true

[tools.params.name]
type = "string"
description = "Symbol name or part of it (e.g. 'Engine', 'compute_pagerank')."
required = true

[tools.params.file]
type = "string"
description = "Only symbols in files whose path contains this substring."

[tools.params.limit]
type = "integer"
description = "Maximum rows (default: 50, hard max: 100)."

[tools.params.include_imports]
type = "boolean"
description = "Also list import/use rows. Default: false."

[[tools]]
name = "search_usages"
description = "Find every place a symbol (function, struct, variable, etc.) is referenced. Exhaustive whole-word scan through the trigram index, so no call site is missed. One line per hit: `path:line:kind: source` (1-based lines; kind is definition, call, reference, import, comment or doc), ordered most useful first: definition, production code, imports, tests, comments, docs. Use this before changing a signature or renaming a symbol. Use `complete=true` to page through the full set ordered by (file, line); follow `next_offset` until `has_more=false`."
handler = "search::call_search_usages"
calling_convention = "engine_args"
read_only = true

[tools.params.symbol]
type = "string"
description = "Symbol name (e.g. 'compute_pagerank', 'IndexConfig')."
required = true

[tools.params.limit]
type = "integer"
description = "Maximum rows per response (default: 20, hard max: 100)."

[tools.params.complete]
type = "boolean"
description = "If true, returns the full reference set (up to 100000) ordered by (file, line) with total/has_more/next_offset pagination metadata instead of the ranked first page. Default: false."

[tools.params.offset]
type = "integer"
description = "Page offset for complete=true (default: 0); pass the previous next_offset."

[[tools]]
name = "read_symbol"
description = "Read the complete source definition of a named symbol (function, struct, class, method, etc.) resolved from the symbol table. More precise than code_search for fetching a known definition \u2014 returns exact source lines with language-tagged fenced code."
handler = "search::call_read_symbol"
calling_convention = "engine_args"
read_only = true

[tools.params.name]
type = "string"
description = "Symbol name to look up (case-insensitive substring, e.g. 'compute_pagerank', 'BM25Retriever', 'IndexConfig')"
required = true

[tools.params.file]
type = "string"
description = "Optional file path substring to disambiguate when multiple symbols share the same name (e.g. 'engine.rs')"

[[tools]]
name = "explain"
description = "Assemble a complete understanding package for a named symbol: its definition source, the top usage sites found via BM25 search (callers), and functions it calls (callees extracted from source). Use when approaching a significant function or class for the first time \u2014 one call beats the `read_symbol` + `search_usages` + `symbol_callees` trio."
handler = "search::call_explain"
calling_convention = "engine_args_progress"
read_only = true

[tools.params.symbol]
type = "string"
description = "Symbol name to explain (e.g. 'compute_pagerank', 'BM25Retriever')"
required = true

[tools.params.file]
type = "string"
description = "Optional file path to disambiguate"

[[tools]]
name = "stitch_context"
description = "Deprecated: use `assemble_context` instead of this tool. Kept for backwards compatibility \u2014 searches for code and automatically attaches callee definitions."
handler = "search::call_stitch_context"
calling_convention = "engine_args"
read_only = true

[tools.params.query]
type = "string"
description = "Search query (same as code_search)"
required = true

[tools.params.limit]
type = "integer"
description = "Number of search results to stitch (default: 5)"

[tools.params.callee_depth]
type = "integer"
description = "How many levels of callee definitions to attach (default: 1)"

[[tools]]
name = "assemble_context"
description = "Assemble cross-file context by gathering related code from multiple files based on a query. Searches for code and automatically attaches the full source of callee definitions referenced in the top results. Use when you need to understand a feature end-to-end \u2014 prefer `code_search` for a ranked result list without the attached callee sources."
handler = "search::call_assemble_context"
calling_convention = "engine_args"
read_only = true

[tools.params.query]
type = "string"
description = "Search query (same as code_search)"
required = true

[tools.params.limit]
type = "integer"
description = "Number of search results to assemble context for (default: 5)"

[tools.params.callee_depth]
type = "integer"
description = "How many levels of callee definitions to attach (default: 1)"

[[tools]]
name = "find_similar"
description = "Find code chunks semantically similar to a named symbol using vector embeddings (cosine similarity) or BM25 fallback. Useful for spotting copy-paste debt or finding parallel implementations."
handler = "analysis::call_find_similar"
calling_convention = "engine_args"
read_only = true

[tools.params.symbol]
type = "string"
description = "Symbol name to find similar code for (e.g. 'compute_pagerank')"
required = true

[tools.params.threshold]
type = "number"
description = "Minimum similarity score 0\u20131 (default: 0.5)"

[tools.params.limit]
type = "integer"
description = "Maximum results to return (default: 10)"
